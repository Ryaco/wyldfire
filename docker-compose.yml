services:
  wyld-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: wyldfire-sync-server:latest
    container_name: wyldfire-server
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - WYLD_SERVER_TOKEN=${WYLD_SERVER_TOKEN:-wyld-secret-token}
      - WYLD_DATA_DIR=/data
      - PORT=8000
    volumes:
      - wyld-data:/data

volumes:
  wyld-data:
    driver: local
